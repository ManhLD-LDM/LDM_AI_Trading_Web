services:
  - type: web
    name: ldm-ai-trading-backend
    env: python
    region: singapore # or ohio/frankfurt
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MONGO_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
